name: Terraform validation
on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  validate:
    name: Terraform validation / ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - id: root
        shell: bash
        env:
          TF_ROOT: terraform/${{ matrix.environment }}
        run: |
          if compgen -G "$TF_ROOT/*.tf" >/dev/null || compgen -G "$TF_ROOT/*.tf.json" >/dev/null; then
            version=1.9.8
            if [[ -f "$TF_ROOT/.terraform-version" ]]; then
              version="$(cat "$TF_ROOT/.terraform-version")"
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            fi
            printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.root.outputs.version != ''
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.root.outputs.version }}
          terraform_wrapper: false
      - if: steps.root.outputs.version != ''
        working-directory: terraform/${{ matrix.environment }}
        shell: bash
        run: |
          set -euo pipefail
          lock=()
          if [[ -f .terraform.lock.hcl ]]; then
            lock=(-lockfile=readonly)
          fi
          terraform init -backend=false -input=false "${lock[@]}"
          terraform validate -no-color
