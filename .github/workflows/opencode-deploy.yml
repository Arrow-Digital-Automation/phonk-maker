name: OpenCode deployment
run-name: ${{ github.event_name == 'workflow_dispatch' && format('OpenCode deployment {0}', inputs.release_id) || 'OpenCode Terraform validation' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      revision:
        description: Full 40-character Git SHA to deploy
        required: true
        type: string
      release_id:
        description: Release identifier for the deployment receipt
        required: true
        type: string
      operation:
        description: Operation to run
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - reload
          - destroy
  # Credential-free validation of both Terraform roots before a release PR merges.
  pull_request:
    paths:
      - "terraform/**"
      - "index.html"
      - ".github/workflows/opencode-deploy.yml"
  push:
    branches:
      - staging
      - main
    paths:
      - "terraform/**"
      - "index.html"
      - ".github/workflows/opencode-deploy.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('opencode-deploy-{0}', inputs.environment) || format('opencode-validate-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    name: Validate terraform/${{ matrix.root }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        root:
          - staging
          - production
    steps:
      - name: Check out revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Provider source check (public registry only)
        shell: bash
        run: |
          set -euo pipefail
          status=0

          while IFS= read -r file; do
            while IFS= read -r source; do
              if [[ "$source" != "hashicorp/aws" ]]; then
                echo "Disallowed provider source '$source' in $file" >&2
                status=1
              fi
            done < <(grep -oE '^[[:space:]]*source[[:space:]]*=[[:space:]]*"[^"]+"' "$file" |
              grep -vE '"\.{1,2}/' |
              sed -E 's/.*"([^"]+)"/\1/' || true)
          done < <(find terraform -name '*.tf' -type f -not -path '*/.terraform/*' | sort)

          if grep -rnE '(resource|data)[[:space:]]+"opencode_|provider[[:space:]]+"opencode"|opencode/opencode' \
            terraform --include='*.tf'; then
            echo "opencode providers/resources are not published to the Terraform Registry" >&2
            status=1
          fi

          exit "$status"

      - name: Terraform fmt
        shell: bash
        run: terraform fmt -check -recursive terraform

      - name: Terraform init (backend disabled)
        working-directory: terraform/${{ matrix.root }}
        shell: bash
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform/${{ matrix.root }}
        shell: bash
        run: terraform validate

      - name: Resolved providers are registry-only
        working-directory: terraform/${{ matrix.root }}
        shell: bash
        run: |
          set -euo pipefail
          terraform providers | tee /tmp/providers.txt
          refs="$(grep -oE '[a-z0-9.-]+\.[a-z]+/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+' /tmp/providers.txt | sort -u || true)"
          unexpected="$(grep -vx 'registry.terraform.io/hashicorp/aws' <<<"$refs" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected providers resolved:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

  guard:
    name: Validate dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.check.outputs.environment }}
      terraform_root: ${{ steps.check.outputs.terraform_root }}
      operation: ${{ steps.check.outputs.operation }}
    steps:
      - name: Check out protected branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate environment, protected branch, operation, and exact revision
        id: check
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_REVISION: ${{ inputs.revision }}
          TARGET_RELEASE_ID: ${{ inputs.release_id }}
          TARGET_OPERATION: ${{ inputs.operation }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          operation="${TARGET_OPERATION:-deploy}"

          case "$TARGET_ENVIRONMENT" in
            staging)
              expected_branch="staging"
              terraform_root="terraform/staging"
              ;;
            production)
              expected_branch="main"
              terraform_root="terraform/production"
              ;;
            *)
              echo "Unsupported environment: $TARGET_ENVIRONMENT" >&2
              exit 1
              ;;
          esac

          case "$operation" in
            deploy|reload|destroy) ;;
            *)
              echo "Unsupported operation: $operation" >&2
              exit 1
              ;;
          esac

          if [[ "$EVENT_REF" != "refs/heads/$expected_branch" ]]; then
            echo "Dispatch must come from protected branch refs/heads/$expected_branch (got $EVENT_REF)" >&2
            exit 1
          fi

          if [[ ! "$TARGET_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full 40-character lowercase SHA" >&2
            exit 1
          fi

          if [[ -z "${TARGET_RELEASE_ID//[[:space:]]/}" ]]; then
            echo "release_id must not be empty" >&2
            exit 1
          fi

          if [[ "$operation" == "deploy" ]]; then
            if [[ "$EVENT_SHA" != "$TARGET_REVISION" ]]; then
              echo "Event SHA $EVENT_SHA does not equal requested revision $TARGET_REVISION" >&2
              exit 1
            fi
          else
            git cat-file -e "${TARGET_REVISION}^{commit}" 2>/dev/null || {
              echo "Revision $TARGET_REVISION is not present in repository history" >&2
              exit 1
            }
            if ! git merge-base --is-ancestor "$TARGET_REVISION" "origin/$expected_branch"; then
              echo "Revision $TARGET_REVISION is not in protected branch $expected_branch history" >&2
              exit 1
            fi
          fi

          {
            echo "environment=$TARGET_ENVIRONMENT"
            echo "terraform_root=$terraform_root"
            echo "operation=$operation"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ needs.guard.outputs.operation }} ${{ needs.guard.outputs.environment }}
    needs: [guard, validate]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      # Required reviewers and environment-scoped secrets/vars are configured
      # on the `staging` and `production` GitHub environments.
      name: ${{ needs.guard.outputs.environment }}
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Configure environment-scoped OIDC identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OPENCODE_DEPLOY_ROLE_ARN }}
          role-session-name: opencode-${{ needs.guard.outputs.operation }}-${{ inputs.environment }}-${{ inputs.release_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ needs.guard.outputs.terraform_root }}
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?missing binding TF_STATE_BUCKET}"
          : "${TF_STATE_KEY:?missing binding TF_STATE_KEY}"
          : "${TF_STATE_REGION:?missing binding TF_STATE_REGION}"
          : "${TF_LOCK_TABLE:?missing binding TF_LOCK_TABLE}"
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE"

      - name: Terraform fmt and validate
        working-directory: ${{ needs.guard.outputs.terraform_root }}
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform validate

      - name: Terraform plan
        working-directory: ${{ needs.guard.outputs.terraform_root }}
        shell: bash
        env:
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_revision: ${{ inputs.revision }}
          TF_VAR_release_id: ${{ inputs.release_id }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          OPERATION: ${{ needs.guard.outputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "destroy" ]]; then
            terraform plan -destroy -input=false -lock-timeout=5m -out=tfplan
          else
            terraform plan -input=false -lock-timeout=5m -out=tfplan
          fi

      - name: Terraform apply
        working-directory: ${{ needs.guard.outputs.terraform_root }}
        shell: bash
        run: |
          set -euo pipefail
          terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Read deployment outputs
        id: deployed
        if: needs.guard.outputs.operation != 'destroy'
        working-directory: ${{ needs.guard.outputs.terraform_root }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "app_url=$(terraform output -raw app_url)"
            echo "verification_url=$(terraform output -raw verification_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify exact release over HTTPS
        id: verify
        if: needs.guard.outputs.operation != 'destroy'
        shell: bash
        env:
          APP_URL: ${{ steps.deployed.outputs.app_url }}
          VERIFY_URL: ${{ steps.deployed.outputs.verification_url }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail

          [[ "$APP_URL" == https://* ]] || {
            echo "Terraform app_url is not HTTPS: $APP_URL" >&2
            exit 1
          }

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 15 "$APP_URL/" -o /tmp/opencode-index.html &&
               marker="$(curl -fsS --max-time 15 "$VERIFY_URL")"; then
              python3 - "$marker" "$EXPECTED_REVISION" "$EXPECTED_RELEASE_ID" <<'PY'
          import json
          import sys

          marker, expected_revision, expected_release_id = sys.argv[1:4]
          payload = json.loads(marker)
          actual_revision = payload.get("revision") or payload.get("sha")
          actual_release_id = payload.get("releaseId") or payload.get("release_id")

          if actual_revision != expected_revision:
              raise SystemExit(
                  f"revision mismatch: expected {expected_revision}, got {actual_revision}"
              )
          if actual_release_id != expected_release_id:
              raise SystemExit(
                  f"release mismatch: expected {expected_release_id}, got {actual_release_id}"
              )
          PY
              echo "Verified $EXPECTED_REVISION / $EXPECTED_RELEASE_ID at $APP_URL"
              exit 0
            fi
            echo "Release not verifiable yet (attempt $attempt/30)"
            sleep 5
          done

          echo "Release did not become verifiable at $APP_URL" >&2
          exit 1

      - name: Publish GitHub deployment receipt
        id: receipt
        if: needs.guard.outputs.operation != 'destroy'
        uses: actions/github-script@v7
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_REVISION: ${{ inputs.revision }}
          RELEASE_ID: ${{ inputs.release_id }}
          OPERATION: ${{ needs.guard.outputs.operation }}
          APP_URL: ${{ steps.deployed.outputs.app_url }}
        with:
          script: |
            const environment = process.env.TARGET_ENVIRONMENT;
            const ref = process.env.TARGET_REVISION;
            const releaseId = process.env.RELEASE_ID;
            const operation = process.env.OPERATION;
            const appUrl = process.env.APP_URL;
            const logUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment,
              task: "opencode-deploy",
              auto_merge: false,
              required_contexts: [],
              payload: { opencodeRelease: releaseId, opencodeOperation: operation },
              description: `OpenCode ${operation} ${releaseId}`,
            });

            core.setOutput("deployment_id", deployment.id);

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "success",
              environment,
              environment_url: appUrl,
              log_url: logUrl,
              description: `OpenCode ${operation} ${releaseId} succeeded`,
            });

      - name: Publish GitHub destroy receipt
        id: destroy_receipt
        if: needs.guard.outputs.operation == 'destroy'
        uses: actions/github-script@v7
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_REVISION: ${{ inputs.revision }}
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const environment = process.env.TARGET_ENVIRONMENT;
            const ref = process.env.TARGET_REVISION;
            const releaseId = process.env.RELEASE_ID;
            const logUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment,
              task: "opencode-deploy",
              auto_merge: false,
              required_contexts: [],
              payload: { opencodeRelease: releaseId, opencodeOperation: "destroy" },
              description: `OpenCode destroy ${releaseId}`,
            });

            core.setOutput("deployment_id", deployment.id);

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "inactive",
              environment,
              log_url: logUrl,
              description: `OpenCode destroy ${releaseId} completed`,
            });
